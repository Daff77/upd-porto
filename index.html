    <script>
      // IIFE to avoid polluting global scope
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            // Default to light if theme is 'light' or not set
            document.documentElement.classList.remove("dark");
            if (!theme) {
              // If no theme was stored, set it to 'light'
              localStorage.setItem("theme", "light");
            }
          }
        } catch (e) {
          // Fallback for environments where localStorage might be restricted
          console.warn("Could not set initial theme from localStorage:", e);
          document.documentElement.classList.remove("dark"); // Default to light on error
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class", // Enable class-based dark mode
        theme: {
          extend: {
            fontFamily: {
              display: ["Satoshi", "system-ui", "sans-serif"],
              sans: ["Satoshi", "system-ui", "sans-serif"],
              mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
              hand: ['"Caveat"', "cursive"],
            },
            colors: {
              // Outer page canvas
              canvas: "#FFFFFF",
              "dark-canvas": "#0E0E0F",

              // Light theme (paper white + warm stone + crisp ink + warm orange accent)
              background: "#FFFFFF",
              card: "#FFFFFF",
              "card-hover": "#F2F1EF",
              border: "rgba(10, 10, 10, 0.12)",
              "border-subtle": "rgba(10, 10, 10, 0.07)",
              "input-bg": "#F2F1EF",
              "input-border": "rgba(10, 10, 10, 0.14)",
              "text-primary": "#0A0A0A",
              "text-secondary": "rgba(10, 10, 10, 0.62)",
              "text-placeholder": "rgba(10, 10, 10, 0.40)",

              "button-primary-bg": "#0A0A0A",
              "button-primary-text": "#FFFFFF",
              "button-primary-hover": "#262626",

              "button-secondary-bg": "#F2F1EF",
              "button-secondary-text": "#0A0A0A",
              "button-secondary-hover": "#E7E5E0",

              accent: "#FF6308",
              "accent-subtle": "rgba(255, 99, 8, 0.10)",
              "accent-green": "#FF6308",
              "accent-green-bg": "rgba(255, 99, 8, 0.10)",
              "status-live": "#0C8463",
              "accent-red": "#E11D48",

              // Dark theme
              "dark-background": "#0E0E0F",
              "dark-card": "#171719",
              "dark-card-hover": "#202023",
              "dark-border": "rgba(255, 255, 255, 0.12)",
              "dark-border-subtle": "rgba(255, 255, 255, 0.07)",
              "dark-input-bg": "#171719",
              "dark-input-border": "rgba(255, 255, 255, 0.14)",
              "dark-text-primary": "#F5F5F4",
              "dark-text-secondary": "rgba(245, 245, 244, 0.64)",
              "dark-text-placeholder": "rgba(245, 245, 244, 0.40)",

              "dark-button-primary-bg": "#F5F5F4",
              "dark-button-primary-text": "#0E0E0F",
              "dark-button-primary-hover": "#FFFFFF",

              "dark-button-secondary-bg": "#171719",
              "dark-button-secondary-text": "#F5F5F4",
              "dark-button-secondary-hover": "#232327",

              "dark-accent": "#FF7A2E",
              "dark-accent-subtle": "rgba(255, 122, 46, 0.14)",
              "dark-accent-green": "#FF7A2E",
              "dark-accent-green-bg": "rgba(255, 122, 46, 0.14)",
              "dark-status-live": "#34D399",
              "dark-accent-red": "#FB7185",
            },
            ringColor: (theme) => ({
              DEFAULT: theme("colors.accent"),
            }),
            animation: {
              "spin-slow": "spin-slow 20s linear infinite",
            },
            keyframes: {
              "spin-slow": {
                to: { transform: "rotate(360deg)" },

      };
    </script>
    <style>
      :root {
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      html.lenis,
      html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }

      .page-transition {
        transition: opacity 0.3s ease-in-out;
      }
      .page-fade-enter {
        opacity: 0;
      }
      .page-fade-enter-active {
        opacity: 1;
      }
      .page-fade-exit {
        opacity: 1;
      }
      .page-fade-exit-active {
        opacity: 0;
      }
      /* Ensure html/body take full height for sticky footer */
      html,
      body,
      #root {
        min-height: 100vh;
      }
      #root {
        display: flex;
        flex-direction: column;
      }

      /* Global transitions for theme changes */
      *,
      *::before,
      *::after {
        transition-property:
          background-color, border-color, color, fill, stroke;
        transition-duration: 0.3s;
        transition-timing-function: ease-in-out;
      }

      /* Theme toggle: Circular Theme Reveal from toggle button */
      [data-theme-transition],
      [data-theme-transition] *,
      [data-theme-transition] *::before,
      [data-theme-transition] *::after {
        transition: none !important;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }

      ::view-transition-old(root) {
        z-index: 1;
      }

      ::view-transition-new(root) {
        z-index: 9999;
      }

      /* Page Load Animations (Faiz-inspired blur + vertical rise) */
      @keyframes rise-in {
        from {
          opacity: 0;
          filter: blur(2px);
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }

      .rise-in {
        animation: rise-in 520ms var(--ease-out) both;
        animation-delay: calc(var(--n, 0) * 90ms);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .animated-item {
        opacity: 0;
      }

      .anim-fadeInUp {
        animation: fadeInUp 0.5s ease-out forwards;
      }

      .anim-fadeIn {
        animation: fadeIn 0.4s ease-out forwards;
      }

      .anim-delay-100 {
        animation-delay: 0.1s;
      }
      .anim-delay-200 {
        animation-delay: 0.2s;
      }
      .anim-delay-300 {
        animation-delay: 0.3s;
      }
      .anim-delay-400 {
        animation-delay: 0.4s;
      }
      .anim-delay-500 {
        animation-delay: 0.5s;
      }
      .anim-delay-600 {
        animation-delay: 0.6s;
      }
      .anim-delay-700 {
        animation-delay: 0.7s;
      }

      .reveal {
        opacity: 0;
        filter: blur(2px);
        transform: translateY(10px);
        transition:
          opacity 480ms var(--ease-out),
          transform 520ms var(--ease-out),
          filter 480ms var(--ease-out);
      }
      .reveal.is-visible {
        opacity: 1;
        filter: blur(0);
        transform: none;
      }
      :focus-visible {
        outline: 2px solid #FF6308;
        outline-offset: 3px;
        border-radius: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal,
        .rise-in,
        .animated-item {
          opacity: 1 !important;
          filter: none !important;
          transform: none !important;
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
